name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Java
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r triallock/requirements.txt
      - name: Run tests
        run: pytest triallock/tests -v
      - name: Lint check
        run: python -m py_compile triallock/*.py
